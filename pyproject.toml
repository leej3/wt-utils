[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wt-utils"
version = "0.1.0"
description = "Git worktrees in one place, with fzf for people and explicit selection for agents"
requires-python = ">=3.12"
license = "MIT"

[project.scripts]
wt = "wt_utils.cli:main"

[tool.setuptools.packages.find]
include = ["wt_utils*"]

[tool.ruff]
line-length = 88
